# configs/train_ddp.yaml
# Configuración para entrenamiento DDP (multi-GPU)
# Uso: python -m torch.distributed.run --nproc_per_node=2 scripts/train_ddp.py

defaults:
  - _self_

# Experiment
experiment_name: yolo_finetune_ddp
run_name: finetune_ddp_${now:%Y%m%d_%H%M%S}

# Modelo base
model: yolov11n.pt

# Dataset (ruta al archivo .yaml de YOLO)
data: data/dataset.yaml

# Hiperparámetros
epochs: 50
imgsz: 640
batch_size: 32  # batch por GPU
patience: 10
device: cuda

# Output
output_dir: runs/train_ddp